name: medusa-stack

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa-postgres
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password
      POSTGRES_DB: medusa_db
    ports:
      - "5433:5432"
    volumes:
      - medusa_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medusa-redis
    ports:
      - "6380:6379"
    volumes:
      - medusa_redisdata:/data

volumes:
  medusa_pgdata:
  medusa_redisdata:
